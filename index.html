<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Mansi Project</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080000;--surface:#100000;--surface2:#180000;
  --border:#2a0000;--border2:#3a0000;
  --red:#cc0000;--red-light:#ff3333;--red-dim:#7a0000;--red-glow:#ff333322;
  --text:#ffffff;--text-dim:#cc9999;--text-muted:#6a3333;--text-faint:#3a1010;
}
body{background:var(--bg);color:var(--text);font-family:'Crimson Text',Georgia,serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,rgba(40,0,0,0.9) 0%,transparent 55%),radial-gradient(ellipse at 80% 90%,rgba(25,0,0,0.9) 0%,transparent 55%);pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:0 20px 80px;}

/* HEADER */
header{text-align:center;padding:44px 0 28px;}
.eyebrow{font-size:11px;letter-spacing:7px;color:var(--red);text-transform:uppercase;margin-bottom:10px;font-family:'Cinzel',serif;}
h1{font-family:'Cinzel',serif;font-size:clamp(1.8rem,5vw,3.2rem);font-weight:400;background:linear-gradient(135deg,#fff 0%,#ff3333 50%,#fff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px;}
.subtitle{color:var(--text-muted);margin-top:8px;font-size:14px;letter-spacing:1px;font-style:italic;}
.stats{display:flex;justify-content:center;gap:24px;margin-top:24px;flex-wrap:wrap;}
.stat{text-align:center;}
.stat-num{font-size:20px;font-weight:600;font-family:'Cinzel',serif;}
.stat-label{font-size:9px;color:var(--text-faint);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}

/* NAV TABS */
.tabs{display:flex;justify-content:center;gap:5px;margin:28px 0 18px;flex-wrap:wrap;}
.tab{padding:8px 18px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.015);color:var(--text-muted);cursor:pointer;font-size:12px;letter-spacing:1px;font-family:'Crimson Text',serif;transition:all 0.2s;}
.tab.active{border-color:var(--red);background:rgba(180,0,0,0.18);color:var(--red-light);}
.tab:hover:not(.active){border-color:var(--red-dim);color:var(--text-dim);}

/* FILTER ROW */
.filter-row{display:flex;justify-content:center;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
.filter-btn{padding:4px 14px;border-radius:20px;border:1px solid var(--text-faint);background:transparent;color:var(--text-muted);cursor:pointer;font-size:11px;letter-spacing:1px;transition:all 0.2s;font-family:'Crimson Text',serif;}
.filter-btn.active{border-color:var(--red-dim);background:rgba(180,0,0,0.2);color:var(--red-light);}

/* BOARD */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:20px;}
.board-col{min-width:240px;flex:0 0 240px;background:rgba(255,255,255,0.015);border-radius:12px;padding:14px;}
.col-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.col-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-family:'Cinzel',serif;}
.col-count{margin-left:auto;color:var(--text-faint);font-size:11px;}
.col-add{background:none;border:1px dashed var(--border2);color:var(--text-muted);border-radius:6px;padding:7px;width:100%;cursor:pointer;font-size:11px;margin-top:8px;transition:all 0.2s;font-family:'Crimson Text',serif;}
.col-add:hover{border-color:var(--red-dim);color:var(--red-light);}
.cards{display:flex;flex-direction:column;gap:8px;}
.card{background:var(--surface);border:1px solid #1a0808;border-radius:8px;padding:11px;cursor:pointer;transition:border-color 0.2s,transform 0.15s;border-left:3px solid transparent;}
.card:hover{transform:translateY(-2px);}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;background:#150000;color:var(--red);letter-spacing:0.5px;white-space:nowrap;}
.badge.green{background:#001500;color:#4ade80;}
.badge.yellow{background:#151000;color:#f0d060;}
.badge.white{background:#1a1a1a;color:#ffffff;}
.badge.series-unfold{background:#1a0000;color:#ff6666;}
.badge.series-reflect{background:#0a0a1a;color:#8888ff;}
.badge.series-decode{background:#001a00;color:#66cc66;}
.badge.series-short{background:#1a0a00;color:#ffaa44;}
.card-title{font-size:12px;color:#f0dada;line-height:1.4;}
.card-date{font-size:10px;color:var(--text-faint);margin-top:5px;}
.card-edit-title{font-size:12px;background:transparent;border:none;border-bottom:1px solid var(--red-dim);color:#f0dada;width:100%;outline:none;font-family:'Crimson Text',serif;padding:2px 0;}

/* TABLE */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{padding:9px 12px;text-align:left;color:var(--text-faint);letter-spacing:1px;font-size:9px;text-transform:uppercase;border-bottom:1px solid #1a0000;font-family:'Cinzel',serif;font-weight:400;}
tbody tr{border-bottom:1px solid #0a0000;cursor:pointer;transition:background 0.15s;}
tbody tr:nth-child(even){background:rgba(255,255,255,0.008);}
tbody tr:hover{background:rgba(180,0,0,0.06);}
td{padding:8px 12px;vertical-align:middle;}
.td-num{color:var(--text-faint);}
.td-title{color:#f0dada;max-width:200px;}
.td-title input{background:transparent;border:none;border-bottom:1px solid transparent;color:#f0dada;font-size:12px;font-family:'Crimson Text',serif;width:100%;cursor:text;outline:none;}
.td-title input:focus{border-bottom-color:var(--red-dim);}
.td-notes{color:var(--text-muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic;font-size:11px;}
select.status-select{border-radius:4px;padding:3px 7px;font-size:10px;cursor:pointer;font-family:'Crimson Text',serif;}
input[type="date"]{background:#0a0000;border:1px solid #1a0000;color:#aa5555;border-radius:4px;padding:3px 7px;font-size:10px;color-scheme:dark;font-family:'Crimson Text',serif;}
input[type="checkbox"]{accent-color:var(--red);width:14px;height:14px;cursor:pointer;}

/* PIPELINE VIEW */
.pipeline{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.pipeline-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;}
.pipeline-section h3{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.pipeline-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--text-faint);}
.pipeline-item:last-child{border-bottom:none;}
.pipeline-item-title{font-size:12px;color:#f0dada;flex:1;line-height:1.4;}
.pipeline-item-meta{font-size:10px;color:var(--text-muted);}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:16px;}
.cal-nav button{background:none;border:1px solid #2a0000;color:var(--red);border-radius:6px;padding:5px 12px;cursor:pointer;font-size:15px;transition:border-color 0.2s;}
.cal-nav button:hover{border-color:var(--red);}
.cal-month{color:var(--red-light);letter-spacing:3px;font-size:15px;font-family:'Cinzel',serif;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;color:var(--text-faint);font-size:9px;letter-spacing:2px;padding:5px 0;text-transform:uppercase;font-family:'Cinzel',serif;}
.cal-cell{min-height:90px;background:rgba(255,255,255,0.015);border:1px solid #150000;border-radius:7px;padding:6px;overflow:hidden;position:relative;}
.cal-cell.today{background:rgba(180,0,0,0.1);border-color:#7a0000;}
.cal-day{font-size:10px;color:var(--text-muted);margin-bottom:3px;}
.cal-cell.today .cal-day{color:var(--red-light);font-weight:600;}
.cal-event{font-size:9px;border-radius:3px;padding:2px 4px;margin-bottom:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity 0.15s;}
.cal-event:hover{opacity:0.8;}
.cal-more{font-size:9px;color:var(--text-muted);}
.cal-add-btn{position:absolute;bottom:3px;right:4px;background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;line-height:1;transition:color 0.15s;}
.cal-add-btn:hover{color:var(--red);}

/* TODO */
.todo-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.todo-wrap{grid-template-columns:1fr;}}
.todo-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;}
.todo-section h3{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;color:var(--red-light);padding-bottom:8px;border-bottom:1px solid var(--border);}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--text-faint);}
.todo-item:last-child{border-bottom:none;}
.todo-check{flex-shrink:0;margin-top:2px;}
.todo-text{flex:1;}
.todo-title{font-size:12px;color:#f0dada;line-height:1.4;}
.todo-due{font-size:10px;margin-top:2px;}
.todo-due.overdue{color:#ff4444;}
.todo-due.soon{color:#f0d060;}
.todo-due.ok{color:var(--text-muted);}
.todo-empty{font-size:12px;color:var(--text-faint);font-style:italic;text-align:center;padding:20px 0;}
.add-todo-row{display:flex;gap:8px;margin-top:12px;}
.add-todo-input{flex:1;background:#0a0000;border:1px solid #1a0000;color:#f0dada;border-radius:6px;padding:7px 10px;font-size:12px;font-family:'Crimson Text',serif;outline:none;}
.add-todo-input:focus{border-color:var(--red-dim);}
.add-todo-btn{background:var(--red-dim);border:none;color:var(--text-dim);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:12px;font-family:'Crimson Text',serif;transition:background 0.2s;}
.add-todo-btn:hover{background:var(--red);}

/* ROUGH IDEAS */
.rough-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.rough-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;}
.rough-card textarea{width:100%;background:transparent;border:none;color:#f0dada;font-size:13px;font-family:'Crimson Text',serif;resize:none;outline:none;line-height:1.5;min-height:80px;}
.rough-card textarea::placeholder{color:var(--text-faint);}
.rough-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);}
.rough-card-date{font-size:10px;color:var(--text-faint);}
.promote-btn{background:none;border:1px solid var(--red-dim);color:var(--red-light);border-radius:4px;padding:3px 10px;cursor:pointer;font-size:10px;font-family:'Cinzel',serif;letter-spacing:1px;transition:all 0.2s;}
.promote-btn:hover{background:rgba(180,0,0,0.2);}
.delete-btn{background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;position:absolute;top:8px;right:8px;transition:color 0.2s;}
.delete-btn:hover{color:var(--red-light);}
.add-rough-btn{width:100%;padding:14px;background:rgba(255,255,255,0.02);border:1px dashed var(--border2);border-radius:10px;color:var(--text-muted);cursor:pointer;font-size:13px;font-family:'Crimson Text',serif;transition:all 0.2s;letter-spacing:1px;}
.add-rough-btn:hover{border-color:var(--red-dim);color:var(--red-light);}

/* SHORTS */
.shorts-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.shorts-header h2{font-family:'Cinzel',serif;font-size:14px;letter-spacing:3px;color:var(--red-light);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px);}
.modal{background:#0e0000;border:1px solid #3a0000;border-radius:16px;padding:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 0 60px rgba(180,0,0,0.25);animation:fadeUp 0.2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.modal-header{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.modal-close{margin-left:auto;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:20px;line-height:1;}
.modal-title-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--red-dim);color:#fff;font-size:17px;font-family:'Cinzel',serif;font-weight:400;margin-bottom:22px;padding-bottom:6px;outline:none;line-height:1.4;}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.field label{display:block;font-size:9px;color:#5a2020;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;font-family:'Cinzel',serif;}
.field select,.field input[type="date"],.field select.modal-sel{width:100%;border-radius:6px;padding:7px 9px;font-size:12px;font-family:'Crimson Text',serif;}
.field select.modal-sel{background:#0a0000;border:1px solid #2a0000;color:#f0dada;}
.script-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer;}
.script-label{font-size:13px;transition:color 0.2s;}
.field textarea{width:100%;background:#050000;border:1px solid #1a0000;color:#f0dada;border-radius:8px;padding:9px 11px;font-size:12px;resize:vertical;font-family:'Crimson Text',serif;line-height:1.5;outline:none;}
.field textarea:focus{border-color:var(--red-dim);}
.save-btn{width:100%;padding:11px;background:linear-gradient(135deg,#7a0000,#cc0000);border:none;border-radius:8px;color:#fff;font-size:13px;cursor:pointer;letter-spacing:2px;font-family:'Cinzel',serif;transition:opacity 0.2s;margin-top:4px;}
.save-btn:hover{opacity:0.9;}

/* PROMOTE MODAL */
.promote-modal{background:#0e0000;border:1px solid #3a0000;border-radius:16px;padding:28px;max-width:460px;width:100%;box-shadow:0 0 60px rgba(180,0,0,0.25);animation:fadeUp 0.2s ease;}
.promote-modal h3{font-family:'Cinzel',serif;font-size:14px;letter-spacing:2px;color:var(--red-light);margin-bottom:18px;}
.promote-modal label{display:block;font-size:9px;color:#5a2020;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px;font-family:'Cinzel',serif;}
.promote-modal select,.promote-modal input{width:100%;background:#0a0000;border:1px solid #2a0000;color:#f0dada;border-radius:6px;padding:8px 10px;font-size:12px;font-family:'Crimson Text',serif;margin-bottom:14px;outline:none;}
.promote-modal .btn-row{display:flex;gap:8px;margin-top:4px;}
.btn-cancel{flex:1;padding:9px;background:transparent;border:1px solid var(--border2);color:var(--text-dim);border-radius:6px;cursor:pointer;font-family:'Crimson Text',serif;font-size:12px;}
.btn-promote{flex:1;padding:9px;background:linear-gradient(135deg,#7a0000,#cc0000);border:none;color:#fff;border-radius:6px;cursor:pointer;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;}

/* UTILS */
.hidden{display:none!important;}
.section-add-row{display:flex;gap:8px;margin-bottom:20px;}
.section-add-input{flex:1;background:#0a0000;border:1px solid #1a0000;color:#f0dada;border-radius:6px;padding:8px 12px;font-size:13px;font-family:'Crimson Text',serif;outline:none;}
.section-add-input:focus{border-color:var(--red-dim);}
.section-add-btn{background:var(--red-dim);border:none;color:var(--text);border-radius:6px;padding:8px 18px;cursor:pointer;font-size:12px;font-family:'Cinzel',serif;letter-spacing:1px;transition:background 0.2s;}
.section-add-btn:hover{background:var(--red);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:#2a0000;border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="eyebrow">☽ Content Tracker ☾</div>
    <h1>The Mansi Project</h1>
    <p class="subtitle">Horror · Paranormal · Cinema · Psychology</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('board')">⬛ Board</button>
    <button class="tab" onclick="switchTab('table')">📋 Table</button>
    <button class="tab" onclick="switchTab('pipeline')">🔀 Pipeline</button>
    <button class="tab" onclick="switchTab('calendar')">🗓 Calendar</button>
    <button class="tab" onclick="switchTab('todo')">✅ To-Do</button>
    <button class="tab" onclick="switchTab('shorts')">⚡ Shorts</button>
    <button class="tab" onclick="switchTab('rough')">💡 Rough Ideas</button>
  </div>

  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" onclick="setFilter('All')">All</button>
    <button class="filter-btn" onclick="setFilter('Unfold')">👻 Unfold</button>
    <button class="filter-btn" onclick="setFilter('Reflect')">🎬 Reflect</button>
    <button class="filter-btn" onclick="setFilter('Decode')">🧠 Decode</button>
    <button class="filter-btn" onclick="setFilter('scripted')">✍ Scripted</button>
    <button class="filter-btn" onclick="setFilter('unscripted')">📝 Needs Script</button>
  </div>

  <div id="view-board"><div class="board" id="board-cols"></div></div>
  <div id="view-table" class="hidden">
    <div class="section-add-row">
      <input class="section-add-input" id="new-video-title" placeholder="New video title…" />
      <select id="new-video-series" style="background:#0a0000;border:1px solid #1a0000;color:#f0dada;border-radius:6px;padding:8px 10px;font-size:12px;font-family:'Crimson Text',serif;outline:none;">
        <option value="Unfold">👻 Unfold</option><option value="Reflect">🎬 Reflect</option><option value="Decode">🧠 Decode</option>
      </select>
      <button class="section-add-btn" onclick="addVideo()">+ Add</button>
    </div>
    <div class="table-wrap"><table><thead><tr>
      <th>#</th><th>Series</th><th>Title</th><th>Status</th><th>Script</th><th>Publish Date</th><th>Notes</th><th></th>
    </tr></thead><tbody id="table-body"></tbody></table></div>
  </div>
  <div id="view-pipeline" class="hidden"><div class="pipeline" id="pipeline-cols"></div></div>
  <div id="view-calendar" class="hidden">
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="cal-month" id="cal-month-label"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
  <div id="view-todo" class="hidden">
    <div class="section-add-row">
      <input class="section-add-input" id="new-todo-text" placeholder="Add a custom task…" />
      <input type="date" id="new-todo-date" style="background:#0a0000;border:1px solid #1a0000;color:#aa5555;border-radius:6px;padding:8px 10px;font-size:12px;color-scheme:dark;font-family:'Crimson Text',serif;" />
      <button class="section-add-btn" onclick="addTodo()">+ Add</button>
    </div>
    <div class="todo-wrap" id="todo-wrap"></div>
  </div>
  <div id="view-shorts" class="hidden">
    <div class="shorts-header">
      <h2>⚡ YouTube Shorts</h2>
      <button class="section-add-btn" onclick="openAddShort()">+ Add Short</button>
    </div>
    <div class="board" id="shorts-board"></div>
  </div>
  <div id="view-rough" class="hidden">
    <div class="rough-grid" id="rough-grid"></div>
  </div>
</div>

<!-- VIDEO MODAL -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="badge" id="m-num"></span>
      <span class="badge" id="m-series-badge"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <input class="modal-title-input" id="m-title-input" placeholder="Video title…" />
    <div class="field-grid">
      <div class="field"><label>Series</label>
        <select class="modal-sel" id="m-series" onchange="modalLiveUpdate('series',this.value)">
          <option value="Unfold">👻 Unfold</option><option value="Reflect">🎬 Reflect</option><option value="Decode">🧠 Decode</option>
        </select>
      </div>
      <div class="field"><label>Status</label>
        <select class="modal-sel" id="m-status" onchange="modalLiveStatus(this.value)"></select>
      </div>
    </div>
    <div class="field-grid">
      <div class="field"><label>Publish Date</label>
        <input type="date" id="m-date" style="background:#0a0000;border:1px solid #2a0000;color:#aa5555;border-radius:6px;padding:7px 9px;font-size:12px;color-scheme:dark;font-family:'Crimson Text',serif;width:100%;" />
      </div>
      <div class="field"><label>Priority</label>
        <select class="modal-sel" id="m-priority">
          <option value="normal">Normal</option><option value="high">🔥 High</option><option value="low">Low</option>
        </select>
      </div>
    </div>
    <div class="script-row" onclick="toggleModalScript()">
      <input type="checkbox" id="m-script" style="accent-color:#cc0000;width:16px;height:16px;" />
      <span class="script-label" id="m-script-label"></span>
    </div>
    <div class="field" style="margin-bottom:16px;"><label>Notes</label>
      <textarea id="m-notes" rows="4" placeholder="Research links, ideas, references…"></textarea>
    </div>
    <button class="save-btn" onclick="saveModal()">Save Changes</button>
  </div>
</div>

<div class="modal-overlay hidden" id="promote-overlay" onclick="closePromote(event)">
  <div class="promote-modal" onclick="event.stopPropagation()">
    <h3>Promote to Main Plan</h3>
    <label>Title</label>
    <input id="promote-title" placeholder="Video title…" />
    <label>Series</label>
    <select id="promote-series">
      <option value="Unfold">👻 Unfold</option><option value="Reflect">🎬 Reflect</option><option value="Decode">🧠 Decode</option>
    </select>

      <button class="btn-promote" onclick="confirmPromote()">Promote ✦</button>
    </div>
  </div>
</div>

<script>
// ─── DATA ─────────────────────────────────────────────────────
const STATUS_COLORS = {
  Idea:      {bg:'#150000',border:'#4a0000',text:'#ff3333',dot:'#cc0000'},
  Scripting: {bg:'#0a0a00',border:'#2a2a00',text:'#f0d060',dot:'#c8a820'},
  Filming:   {bg:'#0a0f0a',border:'#0a3a0a',text:'#60d060',dot:'#22a022'},
  Scripted:  {bg:'#0a1500',border:'#1a4a00',text:'#88ee44',dot:'#55bb00'},
  Filming:   {bg:'#0a0f0a',border:'#0a3a0a',text:'#60d060',dot:'#22a022'},
  Filmed:    {bg:'#001a00',border:'#004a00',text:'#44ff88',dot:'#00bb44'},
  Editing:   {bg:'#1a0000',border:'#5a0000',text:'#ff6666',dot:'#ee2222'},
  Edited:    {bg:'#1a0800',border:'#5a2000',text:'#ffaa44',dot:'#dd7700'},
  Live:      {bg:'#0a0000',border:'#440000',text:'#ffffff',dot:'#cc0000'},
};
const STATUSES = ['Idea','Scripting','Scripted','Filming','Filmed','Editing','Edited','Live'];
const SERIES_MAP = {
  Unfold:  {icon:'👻',cls:'series-unfold'},
  Reflect: {icon:'🎬',cls:'series-reflect'},
  Decode:  {icon:'🧠',cls:'series-decode'},
  Short:   {icon:'⚡',cls:'series-short'},
};

const RAW = [
  ['Bhangarh Fort Curse (Rajasthan)','Tumbbad','Why is fear addictive?'],
  ['Kuldhara Ghost Village','Stree','Why do we enjoy jump scares?'],
  ['Dow Hill Kurseong Hauntings','Pari','Why are women drawn to horror?'],
  ['Dumas Beach Spirits (Gujarat)','Bulbbul','Why do horror films use silence?'],
  ['Ramoji Film City Paranormal Incidents','Bhoot','Why do we fear the dark?'],
  ['Shaniwarwada Ghost (Pune)','13B','Why do haunted places attract us?'],
  ['GP Block Meerut Ghosts','Raat','Why do we believe in ghosts?'],
  ['Jatinga Mystery (Assam)','Pizza (Tamil)','Why are mirrors scary?'],
  ['Tunnel 33 Shimla Ghost','Aval (Tamil)','Why does music make horror intense?'],
  ['Lambi Dehar Mines Mussoorie','Game Over','Why do shadows scare us?'],
  ['Raj Kiran Hotel Lonavala','Chhorii','Why do we watch horror at night?'],
  ['Agrasen Ki Baoli Delhi','Maya (Tamil)','Why do real stories scare more?'],
  ['Delhi Cantonment Lady in White','Ezra (Malayalam)','Why do children fear differently?'],
  ['Savoy Hotel Mussoorie Haunting','Bramayugam','Why do we feel watched?'],
  ['South Park Cemetery Kolkata','Kanchana','Why are abandoned places creepy?'],
  ['Kalpalli Cemetery Bangalore','Arundhati','Why does uncertainty create fear?'],
  ['Malcha Mahal Delhi Curse','Lapachhapi','Why do rituals calm fear?'],
  ['Mukesh Mills Mumbai','Ragini MMS','Why does horror stay in memory?'],
  ['Brij Raj Bhavan Kota Ghost','1920','Why do we imagine ghosts?'],
  ["Writer's Building Kolkata Spirits",'1920 Evil Returns','Why does fear spread socially?'],
];

const SERIES_FOR_TYPE = ['Unfold','Reflect','Decode'];
const STORAGE_KEY = 'mansi-project-v2';

function buildVideos() {
  const vs = []; let id = 1;
  for (let b = 0; b < 3; b++) {
    RAW.forEach(([s,r,w], i) => {
      const num = b*20+i+1;
      [s,r,w].forEach((title, ti) => {
        vs.push({id:id++,videoNum:num,series:SERIES_FOR_TYPE[ti],title,status:'Idea',publishDate:'',scriptWritten:false,notes:'',priority:'normal'});
      });
    });
  }
  return vs;
}

function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const d = JSON.parse(s);
      // migrate old data
      if (d.videos) return d;
    }
  } catch {}
  return {videos:buildVideos(), shorts:[], roughIdeas:[], todos:[], nextId:10000};
}

let data = loadData();
let videos   = data.videos   || buildVideos();
let shorts   = data.shorts   || [];
let roughIdeas = data.roughIdeas || [];
let todos    = data.todos    || [];
let nextId   = data.nextId   || 10000;

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({videos,shorts,roughIdeas,todos,nextId})); } catch {}
}
function newId() { return nextId++; }

// ─── STATE ────────────────────────────────────────────────────
let activeTab = 'board';
let activeFilter = 'All';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let modalId = null;
let promoteRoughId = null;

// ─── FILTER ───────────────────────────────────────────────────
function filtered() {
  if (activeFilter === 'All') return videos;
  if (activeFilter === 'scripted') return videos.filter(v=>v.scriptWritten);
  if (activeFilter === 'unscripted') return videos.filter(v=>!v.scriptWritten);
  return videos.filter(v=>v.series === activeFilter);
}

// ─── STATS ────────────────────────────────────────────────────
function renderStats() {
  const el = document.getElementById('stats');
  let h = STATUSES.map(s=>{
    const c=STATUS_COLORS[s], count=videos.filter(v=>v.status===s).length;
    return `<div class="stat"><div class="stat-num" style="color:${c.text}">${count}</div><div class="stat-label">${s}</div></div>`;
  }).join('');
  h += `<div class="stat"><div class="stat-num" style="color:#4ade80">${videos.filter(v=>v.scriptWritten).length}</div><div class="stat-label">Scripted</div></div>`;
  h += `<div class="stat"><div class="stat-num" style="color:#ffaa44">${shorts.length}</div><div class="stat-label">Shorts</div></div>`;
  el.innerHTML = h;
}

// ─── TAB SWITCH ───────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab')[['board','table','pipeline','calendar','todo','shorts','rough'].indexOf(tab)].classList.add('active');
  ['board','table','pipeline','calendar','todo','shorts','rough'].forEach(t =>
    document.getElementById('view-'+t).classList.toggle('hidden', t!==tab));
  const showFilter = ['board','table','pipeline'].includes(tab);
  document.getElementById('filter-row').classList.toggle('hidden', !showFilter);
  render();
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach((b,i)=>
    b.classList.toggle('active',['All','Unfold','Reflect','Decode','scripted','unscripted'][i]===f));
  render();
}

// ─── UPDATE ───────────────────────────────────────────────────
function updateVideo(id, changes) {
  videos = videos.map(v => v.id===id ? {...v,...changes} : v);
  // If status changed, refresh auto todos for this video if it has a publish date
  if (changes.status) {
    const v = videos.find(x=>x.id===id);
    if (v && v.publishDate) autoGenerateTodos(id, v.publishDate);
  }
  save();
}
function updateShort(id, changes) {
  shorts = shorts.map(s => s.id===id ? {...s,...changes} : s);
  save();
}

// ─── ADD VIDEO ────────────────────────────────────────────────
function addVideo() {
  const titleEl = document.getElementById('new-video-title');
  const seriesEl = document.getElementById('new-video-series');
  const title = titleEl.value.trim();
  if (!title) return;
  const maxNum = videos.length ? Math.max(...videos.map(v=>v.videoNum)) : 0;
  videos.push({id:newId(),videoNum:maxNum+1,series:seriesEl.value,title,status:'Idea',publishDate:'',scriptWritten:false,notes:'',priority:'normal'});
  titleEl.value = '';
  save(); renderStats(); renderTable();
}

// ─── BOARD ────────────────────────────────────────────────────
function renderBoard() {
  const el = document.getElementById('board-cols');
  const vs = filtered();
  el.innerHTML = STATUSES.map(status => {
    const c = STATUS_COLORS[status];
    const cols = vs.filter(v=>v.status===status);
    const cards = cols.map(v => {
      const sr = SERIES_MAP[v.series]||SERIES_MAP.Decode;
      const priorityBadge = v.priority==='high' ? '<span class="badge yellow">🔥</span>' : '';
      return `<div class="card" style="border-left-color:${c.dot}" onclick="openModal(${v.id})"
        onmouseenter="this.style.borderColor='#4a0000'" onmouseleave="this.style.borderColor='#1a0808'">
        <div class="card-meta">
          <span class="badge ${sr.cls}">${sr.icon} ${v.series}</span>
          ${v.scriptWritten?'<span class="badge green">✍</span>':''}
          ${priorityBadge}
        </div>
        <div class="card-title" ondblclick="inlineEditTitle(event,${v.id},'board')">${escHtml(v.title)}</div>
        ${v.publishDate?`<div class="card-date">📅 ${v.publishDate}</div>`:''}
      </div>`;
    }).join('');
    return `<div class="board-col" style="border:1px solid ${c.border}">
      <div class="col-header">
        <span class="col-dot" style="background:${c.dot};box-shadow:0 0 8px ${c.dot}44"></span>
        <span class="col-title" style="color:${c.text}">${status}</span>
        <span class="col-count">${cols.length}</span>
      </div>
      <div class="cards" id="col-${status}">${cards}</div>
      <button class="col-add" onclick="quickAddToStatus('${status}')">+ Add idea here</button>
    </div>`;
  }).join('');
}

function quickAddToStatus(status) {
  const title = prompt(`New video idea for "${status}":`);
  if (!title || !title.trim()) return;
  const series = prompt('Series? (Unfold / Reflect / Decode)', 'Decode');
  const s = ['Unfold','Reflect','Decode'].includes(series) ? series : 'Decode';
  const maxNum = videos.length ? Math.max(...videos.map(v=>v.videoNum)) : 0;
  videos.push({id:newId(),videoNum:maxNum+1,series:s,title:title.trim(),status,publishDate:'',scriptWritten:false,notes:'',priority:'normal'});
  save(); renderStats(); renderBoard();
}

// ─── TABLE ────────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('table-body');
  const vs = filtered();
  tbody.innerHTML = vs.map((v,i) => {
    const c = STATUS_COLORS[v.status];
    const sr = SERIES_MAP[v.series]||SERIES_MAP.Decode;
    const opts = STATUSES.map(s=>`<option value="${s}" ${v.status===s?'selected':''}>${s}</option>`).join('');
    return `<tr onclick="openModal(${v.id})">
      <td class="td-num">${v.videoNum}</td>
      <td><span class="badge ${sr.cls}">${sr.icon} ${v.series}</span></td>
      <td class="td-title" onclick="event.stopPropagation()">
        <input value="${escAttr(v.title)}" onchange="updateVideo(${v.id},{title:this.value});save()" onclick="event.stopPropagation()" />
      </td>
      <td onclick="event.stopPropagation()">
        <select class="status-select" style="background:${c.bg};border:1px solid ${c.border};color:${c.text}"
          onchange="updateVideo(${v.id},{status:this.value});renderStats();renderTable()">
          ${opts}
        </select>
      </td>
      <td onclick="event.stopPropagation()" style="text-align:center">
        <input type="checkbox" ${v.scriptWritten?'checked':''} onchange="updateVideo(${v.id},{scriptWritten:this.checked});renderStats()" />
      </td>
      <td onclick="event.stopPropagation()">
        <input type="date" value="${v.publishDate}" onchange="updateVideo(${v.id},{publishDate:this.value});renderCalendar()" />
      </td>
      <td class="td-notes">${v.notes||'<span style="color:#2a0000">—</span>'}</td>
      <td onclick="event.stopPropagation()">
        <button onclick="deleteVideo(${v.id})" style="background:none;border:none;color:#3a1010;cursor:pointer;font-size:13px;" title="Delete">🗑</button>
      </td>
    </tr>`;
  }).join('');
}

function deleteVideo(id) {
  if (!confirm('Delete this video?')) return;
  videos = videos.filter(v=>v.id!==id);
  save(); renderStats(); render();
}

// ─── PIPELINE ─────────────────────────────────────────────────
function renderPipeline() {
  const el = document.getElementById('pipeline-cols');
  const vs = filtered();
  const sections = [
    {label:'📝 To Be Scripted',  color:'#f0d060', filter: v=>v.status==='Idea'||v.status==='Scripting'},
    {label:'✍️ Scripted',        color:'#88ee44', filter: v=>v.status==='Scripted'},
    {label:'🎥 To Be Filmed',    color:'#60d060', filter: v=>v.status==='Filming'},
    {label:'✅ Filmed',          color:'#44ff88', filter: v=>v.status==='Filmed'},
    {label:'✂️ To Be Edited',    color:'#ff6666', filter: v=>v.status==='Editing'},
    {label:'🎞️ Edited',          color:'#ffaa44', filter: v=>v.status==='Edited'},
    {label:'🔴 Live',            color:'#ffffff', filter: v=>v.status==='Live'},
  ];
  el.innerHTML = sections.map(sec => {
    const items = vs.filter(sec.filter);
    const rows = items.length
      ? items.map(v=>{
          const sr = SERIES_MAP[v.series]||SERIES_MAP.Decode;
          return `<div class="pipeline-item" onclick="openModal(${v.id})" style="cursor:pointer">
            <span class="badge ${sr.cls}">${sr.icon}</span>
            <div>
              <div class="pipeline-item-title">${escHtml(v.title)}</div>
              ${v.publishDate?`<div class="pipeline-item-meta">📅 ${v.publishDate}</div>`:''}
            </div>
            ${v.priority==='high'?'<span style="color:#f0d060;font-size:12px;">🔥</span>':''}
          </div>`;
        }).join('')
      : '<div style="font-size:12px;color:#3a1010;font-style:italic;padding:10px 0;">Nothing here yet</div>';
    return `<div class="pipeline-section">
      <h3 style="color:${sec.color}">${sec.label} <span style="color:#3a1010">(${items.length})</span></h3>
      ${rows}
    </div>`;
  }).join('');
}

// ─── CALENDAR ─────────────────────────────────────────────────
function renderCalendar() {
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent=`${months[calMonth]} ${calYear}`;
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  const byDate={};
  [...videos,...shorts].forEach(v=>{
    if(v.publishDate){(byDate[v.publishDate]=byDate[v.publishDate]||[]).push(v);}
  });
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  let cells=Array(firstDay).fill('<div></div>');
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayVs=byDate[ds]||[];
    const isToday=today.getDate()===d&&today.getMonth()===calMonth&&today.getFullYear()===calYear;
    const events=dayVs.slice(0,3).map(v=>{
      const c=STATUS_COLORS[v.status]||STATUS_COLORS.Idea;
      const sr=SERIES_MAP[v.series]||SERIES_MAP.Decode;
      return `<div class="cal-event" style="background:${c.bg};border:1px solid ${c.border};color:${c.text}"
        onclick="openModal(${v.id})">${sr.icon} ${escHtml(v.title)}</div>`;
    }).join('');
    const more=dayVs.length>3?`<div class="cal-more">+${dayVs.length-3} more</div>`:'';
    cells.push(`<div class="cal-cell${isToday?' today':''}">
      <div class="cal-day">${d}</div>${events}${more}
      <button class="cal-add-btn" onclick="calQuickSchedule('${ds}')" title="Schedule something here">+</button>
    </div>`);
  }
  document.getElementById('cal-grid').innerHTML=dows+cells.join('');
}

function calQuickSchedule(dateStr) {
  const unscheduled = videos.filter(v=>!v.publishDate);
  if (!unscheduled.length) { alert('All videos have a publish date already!'); return; }
  const list = unscheduled.slice(0,20).map((v,i)=>`${i+1}. [${v.series}] ${v.title}`).join('\n');
  const choice = prompt(`Pick a video to schedule on ${dateStr}:\n\n${list}\n\nEnter number:`);
  const idx = parseInt(choice)-1;
  if (isNaN(idx)||idx<0||idx>=unscheduled.length) return;
  updateVideo(unscheduled[idx].id,{publishDate:dateStr});
  renderCalendar();
  autoGenerateTodos(unscheduled[idx].id, dateStr);
}

function changeMonth(dir){
  calMonth+=dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
}

// ─── TODO ─────────────────────────────────────────────────────
function autoGenerateTodos(videoId, publishDate) {
  const v = videos.find(x=>x.id===videoId);
  if (!v) return;
  const pub = new Date(publishDate);
  const fmt = d => d.toISOString().split('T')[0];

  // Remove any previously auto-generated todos for this video so we don't duplicate
  todos = todos.filter(t => !(t.auto && t.videoId === videoId));

  const STATUS_ORDER = ['Idea','Scripting','Scripted','Filming','Filmed','Editing','Edited','Live'];
  const currentIdx = STATUS_ORDER.indexOf(v.status);

  const tasks = [];

  // Script — only if not yet scripted
  if (currentIdx < STATUS_ORDER.indexOf('Scripted')) {
    const d = new Date(pub); d.setDate(d.getDate()-14);
    tasks.push({id:newId(),text:`✍️ Script: ${v.title}`,dueDate:fmt(d),done:false,videoId,auto:true});
  }
  // Film — only if not yet filmed
  if (currentIdx < STATUS_ORDER.indexOf('Filmed')) {
    const d = new Date(pub); d.setDate(d.getDate()-10);
    tasks.push({id:newId(),text:`🎥 Film: ${v.title}`,dueDate:fmt(d),done:false,videoId,auto:true});
  }
  // Edit — only if not yet edited
  if (currentIdx < STATUS_ORDER.indexOf('Edited')) {
    const d = new Date(pub); d.setDate(d.getDate()-5);
    tasks.push({id:newId(),text:`✂️ Edit: ${v.title}`,dueDate:fmt(d),done:false,videoId,auto:true});
  }
  // Thumbnail & upload — only if not yet live
  if (currentIdx < STATUS_ORDER.indexOf('Live')) {
    const d = new Date(pub); d.setDate(d.getDate()-1);
    tasks.push({id:newId(),text:`📤 Thumbnail & upload: ${v.title}`,dueDate:fmt(d),done:false,videoId,auto:true});
  }

  todos.push(...tasks);
  save(); renderTodo();
}

function addTodo() {
  const textEl=document.getElementById('new-todo-text');
  const dateEl=document.getElementById('new-todo-date');
  const text=textEl.value.trim();
  if (!text) return;
  todos.push({id:newId(),text,dueDate:dateEl.value||'',done:false,auto:false});
  textEl.value=''; dateEl.value='';
  save(); renderTodo();
}

function toggleTodo(id) {
  todos=todos.map(t=>t.id===id?{...t,done:!t.done}:t);
  save(); renderTodo();
}

function deleteTodo(id) {
  todos=todos.filter(t=>t.id!==id);
  save(); renderTodo();
}

function renderTodo() {
  const today=new Date(); today.setHours(0,0,0,0);
  const soon=new Date(today); soon.setDate(soon.getDate()+3);
  function dueClass(dueDate){
    if(!dueDate) return 'ok';
    const d=new Date(dueDate);
    if(d<today) return 'overdue';
    if(d<=soon) return 'soon';
    return 'ok';
  }
  function dueLabel(dueDate){
    if(!dueDate) return '';
    const d=new Date(dueDate);
    const dc=dueClass(dueDate);
    const label=dc==='overdue'?'⚠ Overdue':dc==='soon'?'⏰ Due soon':`📅 ${dueDate}`;
    return `<div class="todo-due ${dc}">${label}</div>`;
  }

  const pending=todos.filter(t=>!t.done).sort((a,b)=>(a.dueDate||'9999')>(b.dueDate||'9999')?1:-1);
  const done=todos.filter(t=>t.done);

  function renderItems(items) {
    if(!items.length) return '<div class="todo-empty">Nothing here — you\'re clear ✦</div>';
    return items.map(t=>`<div class="todo-item">
      <input type="checkbox" class="todo-check" ${t.done?'checked':''} onchange="toggleTodo(${t.id})" />
      <div class="todo-text">
        <div class="todo-title" style="${t.done?'text-decoration:line-through;color:#3a1010;':''}">${escHtml(t.text)}</div>
        ${dueLabel(t.dueDate)}
      </div>
      <button onclick="deleteTodo(${t.id})" style="background:none;border:none;color:#3a1010;cursor:pointer;font-size:13px;flex-shrink:0;">✕</button>
    </div>`).join('');
  }

  document.getElementById('todo-wrap').innerHTML=`
    <div class="todo-section">
      <h3>📌 Pending (${pending.length})</h3>
      ${renderItems(pending)}
    </div>
    <div class="todo-section">
      <h3 style="color:#3a1010">✓ Completed (${done.length})</h3>
      ${renderItems(done)}
    </div>`;
}

// ─── SHORTS ───────────────────────────────────────────────────
function openAddShort() {
  const title=prompt('Short title / idea:');
  if(!title||!title.trim()) return;
  shorts.push({id:newId(),title:title.trim(),status:'Idea',publishDate:'',scriptWritten:false,notes:'',series:'Short',priority:'normal'});

function renderShorts() {

  el.innerHTML=STATUSES.map(status=>{
    const c=STATUS_COLORS[status];
    const cols=shorts.filter(s=>s.status===status);
    const cards=cols.map(s=>`<div class="card" style="border-left-color:${c.dot}" onclick="openShortModal(${s.id})"
      onmouseenter="this.style.borderColor='#4a0000'" onmouseleave="this.style.borderColor='#1a0808'">
      <div class="card-meta">
        <span class="badge series-short">⚡ Short</span>
        ${s.scriptWritten?'<span class="badge green">✍</span>':''}

      <div class="card-title">${escHtml(s.title)}</div>
      ${s.publishDate?`<div class="card-date">📅 ${s.publishDate}</div>`:''}
    </div>`).join('');
    return `<div class="board-col" style="border:1px solid ${c.border}">
      <div class="col-header">
        <span class="col-dot" style="background:${c.dot};box-shadow:0 0 8px ${c.dot}44"></span>
        <span class="col-title" style="color:${c.text}">${status}</span>
        <span class="col-count">${cols.length}</span>
      </div>
      <div class="cards">${cards}</div>
      <button class="col-add" onclick="quickAddShortStatus('${status}')">+ Add here</button>
    </div>`;
  }).join('');

function quickAddShortStatus(status) {
  const title=prompt(`New Short for "${status}":`);
  if(!title||!title.trim()) return;
  shorts.push({id:newId(),title:title.trim(),status,publishDate:'',scriptWritten:false,notes:'',series:'Short',priority:'normal'});
  save(); renderStats(); renderShorts();
}

// use same modal for shorts, flag it
let editingShort = false;
function openShortModal(id) {
  editingShort=true;
  const v=shorts.find(x=>x.id===id);
  if(!v) return;
  modalId=id;
  const c=STATUS_COLORS[v.status];
  document.getElementById('m-num').textContent='⚡ Short';
  document.getElementById('m-series-badge').textContent='';
  document.getElementById('m-title-input').value=v.title;
  document.getElementById('m-series').value='Unfold'; // hidden for shorts
  document.getElementById('m-series').closest('.field').style.display='none';
  const sel=document.getElementById('m-status');
  sel.innerHTML=STATUSES.map(s=>`<option value="${s}" ${v.status===s?'selected':''}>${s}</option>`).join('');
  sel.style.background=c.bg; sel.style.border=`1px solid ${c.border}`; sel.style.color=c.text;
  document.getElementById('m-date').value=v.publishDate;
  document.getElementById('m-priority').value=v.priority||'normal';
  document.getElementById('m-script').checked=v.scriptWritten;
  document.getElementById('m-script-label').textContent=v.scriptWritten?'✍️ Script written!':'Script not written yet';
  document.getElementById('m-script-label').style.color=v.scriptWritten?'#4ade80':'#5a2a2a';
  document.getElementById('m-notes').value=v.notes;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

// ─── ROUGH IDEAS ──────────────────────────────────────────────
function renderRough() {
  const el=document.getElementById('rough-grid');
  const cards=roughIdeas.map(r=>`
    <div class="rough-card">
      <button class="delete-btn" onclick="deleteRough(${r.id})">✕</button>
      <textarea onblur="updateRough(${r.id},this.value)" placeholder="Dump your idea here…">${escHtml(r.text)}</textarea>
      <div class="rough-card-footer">
        <span class="rough-card-date">${r.date||''}</span>
        <button class="promote-btn" onclick="openPromote(${r.id})">Promote to Plan ✦</button>
      </div>
    </div>`).join('');
  el.innerHTML=cards+`<button class="add-rough-btn" onclick="addRough()">+ New Idea Card</button>`;
}

function addRough() {
  roughIdeas.push({id:newId(),text:'',date:new Date().toLocaleDateString('en-IN')});
  save(); renderRough();
}
function updateRough(id,text) {
  roughIdeas=roughIdeas.map(r=>r.id===id?{...r,text}:r);
  save();
}
function deleteRough(id) {
  if(!confirm('Delete this idea?')) return;
  roughIdeas=roughIdeas.filter(r=>r.id!==id);
  save(); renderRough();
}
function openPromote(id) {
  promoteRoughId=id;
  const r=roughIdeas.find(x=>x.id===id);
  document.getElementById('promote-title').value=r?r.text.slice(0,80):'';
  document.getElementById('promote-overlay').classList.remove('hidden');
}
function closePromote(e) {
  if(!e||e.target===document.getElementById('promote-overlay')){
    document.getElementById('promote-overlay').classList.add('hidden');
    promoteRoughId=null;
  }
}
function confirmPromote() {
  const title=document.getElementById('promote-title').value.trim();
  const series=document.getElementById('promote-series').value;
  if(!title) return;
  const maxNum=videos.length?Math.max(...videos.map(v=>v.videoNum)):0;
  videos.push({id:newId(),videoNum:maxNum+1,series,title,status:'Idea',publishDate:'',scriptWritten:false,notes:'',priority:'normal'});
  roughIdeas=roughIdeas.filter(r=>r.id!==promoteRoughId);
  save(); renderStats();
  document.getElementById('promote-overlay').classList.add('hidden');
  promoteRoughId=null;
  renderRough();
  alert(`✦ "${title}" added to your ${series} pipeline!`);
}

// ─── VIDEO MODAL ──────────────────────────────────────────────
function openModal(id) {
  editingShort=false;
  const v=videos.find(x=>x.id===id);
  if(!v) return;
  modalId=id;
  const sr=SERIES_MAP[v.series]||SERIES_MAP.Decode;
  const c=STATUS_COLORS[v.status];
  document.getElementById('m-num').textContent=`Video #${v.videoNum}`;
  document.getElementById('m-series-badge').textContent=`${sr.icon} ${v.series}`;
  document.getElementById('m-series-badge').className=`badge ${sr.cls}`;
  document.getElementById('m-title-input').value=v.title;
  document.getElementById('m-series').value=v.series;
  document.getElementById('m-series').closest('.field').style.display='';
  const sel=document.getElementById('m-status');
  sel.innerHTML=STATUSES.map(s=>`<option value="${s}" ${v.status===s?'selected':''}>${s}</option>`).join('');
  sel.style.background=c.bg; sel.style.border=`1px solid ${c.border}`; sel.style.color=c.text;
  document.getElementById('m-date').value=v.publishDate;
  document.getElementById('m-priority').value=v.priority||'normal';
  document.getElementById('m-script').checked=v.scriptWritten;
  document.getElementById('m-script-label').textContent=v.scriptWritten?'✍️ Script written!':'Script not written yet';
  document.getElementById('m-script-label').style.color=v.scriptWritten?'#4ade80':'#5a2a2a';
  document.getElementById('m-notes').value=v.notes;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function modalLiveStatus(val) {
  const c=STATUS_COLORS[val];
  const sel=document.getElementById('m-status');
  sel.style.background=c.bg; sel.style.border=`1px solid ${c.border}`; sel.style.color=c.text;
}
function modalLiveUpdate(field,val) {}
function toggleModalScript() {
  const cb=document.getElementById('m-script');
  cb.checked=!cb.checked;
  document.getElementById('m-script-label').textContent=cb.checked?'✍️ Script written!':'Script not written yet';
  document.getElementById('m-script-label').style.color=cb.checked?'#4ade80':'#5a2a2a';
}
function closeModal(e) {
  if(!e||e.target===document.getElementById('modal-overlay')){
    document.getElementById('modal-overlay').classList.add('hidden');
    modalId=null;
  }
}
function saveModal() {
  if(!modalId) return;
  const changes={
    title: document.getElementById('m-title-input').value.trim()||undefined,
    series: document.getElementById('m-series').value,
    status: document.getElementById('m-status').value,
    publishDate: document.getElementById('m-date').value,
    priority: document.getElementById('m-priority').value,
    scriptWritten: document.getElementById('m-script').checked,
    notes: document.getElementById('m-notes').value,
  };
  if (editingShort) { updateShort(modalId,changes); }
  else {
    const oldDate = videos.find(v=>v.id===modalId)?.publishDate;
    updateVideo(modalId,changes);
    if (changes.publishDate && changes.publishDate !== oldDate) {
      autoGenerateTodos(modalId, changes.publishDate);
    }
  }
  save(); renderStats(); render();
  document.getElementById('modal-overlay').classList.add('hidden');
  modalId=null;
}

// ─── HELPERS ──────────────────────────────────────────────────
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }
function inlineEditTitle(e, id, ctx) {
  e.stopPropagation();
  const div=e.currentTarget;
  const orig=div.textContent;
  div.innerHTML=`<input class="card-edit-title" value="${escAttr(orig)}" onclick="event.stopPropagation()" />`;
  const inp=div.querySelector('input');
  inp.focus(); inp.select();
  inp.onblur=()=>{ updateVideo(id,{title:inp.value.trim()||orig}); render(); };
  inp.onkeydown=e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){div.textContent=orig;} };
}

// ─── RENDER ───────────────────────────────────────────────────
function render() {
  if(activeTab==='board') renderBoard();
  else if(activeTab==='table') renderTable();
  else if(activeTab==='pipeline') renderPipeline();
  else if(activeTab==='calendar') renderCalendar();
  else if(activeTab==='todo') renderTodo();
  else if(activeTab==='shorts') renderShorts();
  else if(activeTab==='rough') renderRough();
}

renderStats(); render();
</script>
