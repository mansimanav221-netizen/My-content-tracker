<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Horror Content Grimoire</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080000;
    --surface: #100000;
    --border: #2a0000;
    --red: #cc0000;
    --red-light: #ff3333;
    --red-dim: #7a0000;
    --text: #ffffff;
    --text-dim: #8a5555;
    --text-muted: #4a1a1a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Text', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(40,0,0,0.8) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(20,0,0,0.8) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 20px 80px; }

  /* HEADER */
  header { text-align: center; padding: 48px 0 32px; }
  .eyebrow { font-size: 12px; letter-spacing: 6px; color: var(--red); text-transform: uppercase; margin-bottom: 12px; font-family: 'Cinzel', serif; }
  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 400;
    background: linear-gradient(135deg, #e2d9f3 0%, #ff3333 50%, #e2d9f3 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .subtitle { color: var(--text-dim); margin-top: 10px; font-size: 15px; letter-spacing: 1px; font-style: italic; }

  /* STATS */
  .stats { display: flex; justify-content: center; gap: 28px; margin-top: 28px; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 600; font-family: 'Cinzel', serif; }
  .stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

  /* TABS */
  .tabs { display: flex; justify-content: center; gap: 6px; margin: 32px 0 20px; }
  .tab {
    padding: 9px 22px; border-radius: 6px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.02); color: var(--text-muted);
    cursor: pointer; font-size: 13px; letter-spacing: 1px; font-family: 'Crimson Text', serif;
    transition: all 0.2s;
  }
  .tab.active { border-color: var(--red); background: rgba(180,0,0,0.15); color: var(--red-light); }
  .tab:hover:not(.active) { border-color: var(--red-dim); color: var(--text-dim); }

  /* FILTERS */
  .filters { display: flex; justify-content: center; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }
  .filter-btn {
    padding: 5px 16px; border-radius: 20px; border: 1px solid #150000;
    background: transparent; color: #4a1a1a; cursor: pointer; font-size: 12px;
    letter-spacing: 1px; transition: all 0.2s; font-family: 'Crimson Text', serif;
  }
  .filter-btn.active { border-color: var(--red-dim); background: rgba(180,0,0,0.2); color: var(--red-light); }

  /* BOARD */
  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 20px; }
  .board-col {
    min-width: 250px; flex: 0 0 250px;
    background: rgba(255,255,255,0.02);
    border-radius: 12px; padding: 14px;
  }
  .col-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .col-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .col-title { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-family: 'Cinzel', serif; }
  .col-count { margin-left: auto; color: var(--text-muted); font-size: 12px; }
  .cards { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface); border: 1px solid #1a0808;
    border-radius: 8px; padding: 12px; cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    border-left: 3px solid transparent;
  }
  .card:hover { transform: translateY(-2px); }
  .card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
    background: #150000; color: var(--red); letter-spacing: 0.5px;
  }
  .badge.script { background: #150000; color: #ff3333; }
  .card-title { font-size: 13px; color: #f0dada; line-height: 1.4; }
  .card-date { font-size: 11px; color: #4a1a1a; margin-top: 6px; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    padding: 10px 14px; text-align: left; color: var(--text-muted);
    letter-spacing: 1px; font-size: 10px; text-transform: uppercase;
    border-bottom: 1px solid #1a0000; font-family: 'Cinzel', serif; font-weight: 400;
  }
  tbody tr { border-bottom: 1px solid #0a0000; cursor: pointer; transition: background 0.15s; }
  tbody tr:nth-child(even) { background: rgba(255,255,255,0.01); }
  tbody tr:hover { background: rgba(180,0,0,0.06); }
  td { padding: 9px 14px; vertical-align: middle; }
  .td-num { color: var(--text-muted); }
  .td-title { color: #f0dada; max-width: 220px; }
  .td-notes { color: var(--text-muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; font-size: 12px; }

  select.status-select {
    border-radius: 4px; padding: 3px 8px; font-size: 11px;
    cursor: pointer; font-family: 'Crimson Text', serif;
  }
  input[type="date"] {
    background: #0a0000; border: 1px solid #1a0000; color: #aa5555;
    border-radius: 4px; padding: 3px 8px; font-size: 11px;
    color-scheme: dark; font-family: 'Crimson Text', serif;
  }
  input[type="checkbox"] { accent-color: var(--red); width: 15px; height: 15px; cursor: pointer; }

  /* CALENDAR */
  .cal-nav { display: flex; align-items: center; justify-content: center; gap: 24px; margin-bottom: 20px; }
  .cal-nav button {
    background: none; border: 1px solid #2a0000; color: var(--red);
    border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 16px;
    transition: border-color 0.2s;
  }
  .cal-nav button:hover { border-color: var(--red); }
  .cal-month { color: var(--red-light); letter-spacing: 3px; font-size: 16px; font-family: 'Cinzel', serif; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-dow { text-align: center; color: var(--text-muted); font-size: 10px; letter-spacing: 2px; padding: 6px 0; text-transform: uppercase; font-family: 'Cinzel', serif; }
  .cal-cell {
    min-height: 78px; background: rgba(255,255,255,0.02);
    border: 1px solid #150000; border-radius: 8px; padding: 7px; overflow: hidden;
  }
  .cal-cell.today { background: rgba(180,0,0,0.1); border-color: #7a0000; }
  .cal-day { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .cal-cell.today .cal-day { color: var(--red-light); font-weight: 600; }
  .cal-event {
    font-size: 10px; border-radius: 3px; padding: 2px 4px;
    margin-bottom: 2px; cursor: pointer; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; transition: opacity 0.15s;
  }
  .cal-event:hover { opacity: 0.8; }
  .cal-more { font-size: 10px; color: var(--text-muted); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal {
    background: #0d0a1a; border: 1px solid #2a0000;
    border-radius: 16px; padding: 32px; max-width: 500px; width: 100%;
    box-shadow: 0 0 60px rgba(180,0,0,0.2);
    animation: fadeUp 0.2s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .modal-header { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .modal-close { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px; line-height: 1; }
  .modal-title { color: var(--text); font-size: 18px; font-family: 'Cinzel', serif; font-weight: 400; margin-bottom: 24px; line-height: 1.4; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  .field label { display: block; font-size: 10px; color: #6a2020; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; font-family: 'Cinzel', serif; }
  .field select, .field input[type="date"] {
    width: 100%; border-radius: 6px; padding: 8px 10px; font-size: 13px;
    font-family: 'Crimson Text', serif;
  }
  .script-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; cursor: pointer; }
  .script-label { font-size: 14px; transition: color 0.2s; }
  .field textarea {
    width: 100%; background: var(--bg); border: 1px solid #1a0000; color: #f0dada;
    border-radius: 8px; padding: 10px 12px; font-size: 13px; resize: vertical;
    font-family: 'Crimson Text', serif; line-height: 1.5;
  }
  .field textarea:focus { outline: none; border-color: var(--red-dim); }
  .save-btn {
    width: 100%; padding: 12px; background: linear-gradient(135deg, #7a0000, #cc0000);
    border: none; border-radius: 8px; color: var(--text); font-size: 14px;
    cursor: pointer; letter-spacing: 1px; font-family: 'Cinzel', serif;
    transition: opacity 0.2s; margin-top: 6px;
  }
  .save-btn:hover { opacity: 0.9; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #2a0000; border-radius: 3px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="eyebrow">☽ Content Grimoire ☾</div>
    <h1>60-Video Master Plan</h1>
    <p class="subtitle">Horror · Paranormal · Cinema · Psychology</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('board')">⬛ Board</button>
    <button class="tab" onclick="switchTab('table')">📋 Table</button>
    <button class="tab" onclick="switchTab('calendar')">🗓 Calendar</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" onclick="setFilter('All')">All</button>
    <button class="filter-btn" onclick="setFilter('A')">👻 Story</button>
    <button class="filter-btn" onclick="setFilter('B')">🎬 Review</button>
    <button class="filter-btn" onclick="setFilter('C')">🧠 Why</button>
  </div>

  <div id="view-board"><div class="board" id="board-cols"></div></div>
  <div id="view-table" class="hidden"><div class="table-wrap"><table id="main-table"><thead><tr>
    <th>#</th><th>Type</th><th>Title</th><th>Status</th><th>Script</th><th>Publish Date</th><th>Notes</th>
  </tr></thead><tbody id="table-body"></tbody></table></div></div>
  <div id="view-calendar" class="hidden">
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="cal-month" id="cal-month-label"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="badge" id="m-num"></span>
      <span class="badge" id="m-type"></span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-title" id="m-title"></div>
    <div class="field-grid">
      <div class="field">
        <label>Status</label>
        <select id="m-status" onchange="modalUpdate('status', this.value)"></select>
      </div>
      <div class="field">
        <label>Publish Date</label>
        <input type="date" id="m-date" oninput="modalUpdate('publishDate', this.value)" />
      </div>
    </div>
    <div class="script-row" onclick="toggleModalScript()">
      <input type="checkbox" id="m-script" />
      <span class="script-label" id="m-script-label"></span>
    </div>
    <div class="field" style="margin-bottom:18px;">
      <label>Notes</label>
      <textarea id="m-notes" rows="4" placeholder="Add your notes, ideas, references…"></textarea>
    </div>
    <button class="save-btn" onclick="saveModal()">Save Changes</button>
  </div>
</div>

<script>
const STATUS_COLORS = {
  Idea:      { bg:'#150000', border:'#7a0000', text:'#ff3333', dot:'#cc0000' },
  Scripting: { bg:'#0a0a00', border:'#2a2a00', text:'#f0d060', dot:'#c8a820' },
  Filming:   { bg:'#0a0f0a', border:'#0a3a0a', text:'#60d060', dot:'#22a022' },
  Editing:   { bg:'#1a0000', border:'#5a0000', text:'#ff6666', dot:'#ee2222' },
  Live:      { bg:'#0a0000', border:'#440000', text:'#ffffff', dot:'#cc0000' },
};
const STATUSES = ['Idea','Scripting','Filming','Editing','Live'];
const TYPES = { A:{label:'Story',icon:'👻'}, B:{label:'Review',icon:'🎬'}, C:{label:'Why',icon:'🧠'} };

const RAW = [
  ['Bhangarh Fort Curse (Rajasthan)','Tumbbad','Why is fear addictive?'],
  ['Kuldhara Ghost Village','Stree','Why do we enjoy jump scares?'],
  ['Dow Hill Kurseong Hauntings','Pari','Why are women drawn to horror?'],
  ['Dumas Beach Spirits (Gujarat)','Bulbbul','Why do horror films use silence?'],
  ['Ramoji Film City Paranormal Incidents','Bhoot','Why do we fear the dark?'],
  ['Shaniwarwada Ghost (Pune)','13B','Why do haunted places attract us?'],
  ['GP Block Meerut Ghosts','Raat','Why do we believe in ghosts?'],
  ['Jatinga Mystery (Assam)','Pizza (Tamil)','Why are mirrors scary?'],
  ['Tunnel 33 Shimla Ghost','Aval (Tamil)','Why does music make horror intense?'],
  ['Lambi Dehar Mines Mussoorie','Game Over','Why do shadows scare us?'],
  ['Raj Kiran Hotel Lonavala','Chhorii','Why do we watch horror at night?'],
  ['Agrasen Ki Baoli Delhi','Maya (Tamil)','Why do real stories scare more?'],
  ['Delhi Cantonment Lady in White','Ezra (Malayalam)','Why do children fear differently?'],
  ['Savoy Hotel Mussoorie Haunting','Bramayugam','Why do we feel watched?'],
  ['South Park Cemetery Kolkata','Kanchana','Why are abandoned places creepy?'],
  ['Kalpalli Cemetery Bangalore','Arundhati','Why does uncertainty create fear?'],
  ['Malcha Mahal Delhi Curse','Lapachhapi','Why do rituals calm fear?'],
  ['Mukesh Mills Mumbai','Ragini MMS','Why does horror stay in memory?'],
  ['Brij Raj Bhavan Kota Ghost','1920','Why do we imagine ghosts?'],
  ["Writer's Building Kolkata Spirits",'1920 Evil Returns','Why does fear spread socially?'],
];

const STORAGE_KEY = 'horror-grimoire-v1';

function buildVideos() {
  const vs = [];
  let id = 1;
  for (let b = 0; b < 3; b++) {
    RAW.forEach(([story, review, why], i) => {
      const num = b * 20 + i + 1;
      ['A','B','C'].forEach((type, ti) => {
        vs.push({ id: id++, videoNum: num, type, title: [story,review,why][ti], status:'Idea', publishDate:'', scriptWritten:false, notes:'' });
      });
    });
  }
  return vs;
}

function loadData() {
  try { const s = localStorage.getItem(STORAGE_KEY); if (s) return JSON.parse(s); } catch {}
  return buildVideos();
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(videos)); } catch {}
}

let videos = loadData();
let activeTab = 'board';
let activeFilter = 'All';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let modalId = null;

function filtered() {
  return activeFilter === 'All' ? videos : videos.filter(v => v.type === activeFilter);
}

function updateVideo(id, changes) {
  videos = videos.map(v => v.id === id ? {...v, ...changes} : v);
  saveData();
}

// ─── STATS ───────────────────────────────────────────────────
function renderStats() {
  const el = document.getElementById('stats');
  let html = STATUSES.map(s => {
    const c = STATUS_COLORS[s];
    const count = videos.filter(v => v.status === s).length;
    return `<div class="stat"><div class="stat-num" style="color:${c.text}">${count}</div><div class="stat-label">${s}</div></div>`;
  }).join('');
  const scripted = videos.filter(v => v.scriptWritten).length;
  html += `<div class="stat"><div class="stat-num" style="color:#ff3333">${scripted}</div><div class="stat-label">Scripted</div></div>`;
  el.innerHTML = html;
}

// ─── TAB + FILTER ────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['board','table','calendar'][i] === tab);
  });
  ['board','table','calendar'].forEach(t => {
    document.getElementById('view-'+t).classList.toggle('hidden', t !== tab);
  });
  document.getElementById('filters').classList.toggle('hidden', tab === 'calendar');
  render();
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach((b, i) => {
    b.classList.toggle('active', ['All','A','B','C'][i] === f);
  });
  render();
}

// ─── BOARD ───────────────────────────────────────────────────
function renderBoard() {
  const el = document.getElementById('board-cols');
  const vs = filtered();
  el.innerHTML = STATUSES.map(status => {
    const c = STATUS_COLORS[status];
    const cols = vs.filter(v => v.status === status);
    const cards = cols.map(v => {
      const t = TYPES[v.type];
      return `<div class="card" style="border-left-color:${c.dot};border-color:#1a0808" onclick="openModal(${v.id})"
        onmouseenter="this.style.borderColor='#4a0000'" onmouseleave="this.style.borderColor='#1a0808'">
        <div class="card-meta">
          <span class="badge">#${v.videoNum} ${t.icon}</span>
          ${v.scriptWritten ? '<span class="badge script">✍ Script</span>' : ''}
        </div>
        <div class="card-title">${v.title}</div>
        ${v.publishDate ? `<div class="card-date">📅 ${v.publishDate}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="board-col" style="border:1px solid ${c.border}">
      <div class="col-header">
        <span class="col-dot" style="background:${c.dot};box-shadow:0 0 8px ${c.dot}"></span>
        <span class="col-title" style="color:${c.text}">${status}</span>
        <span class="col-count">${cols.length}</span>
      </div>
      <div class="cards">${cards}</div>
    </div>`;
  }).join('');
}

// ─── TABLE ───────────────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('table-body');
  const vs = filtered();
  tbody.innerHTML = vs.map((v, i) => {
    const c = STATUS_COLORS[v.status];
    const t = TYPES[v.type];
    const opts = STATUSES.map(s => `<option value="${s}" ${v.status===s?'selected':''}>${s}</option>`).join('');
    return `<tr onclick="openModal(${v.id})">
      <td class="td-num">${v.videoNum}</td>
      <td><span class="badge">${t.icon} ${t.label}</span></td>
      <td class="td-title">${v.title}</td>
      <td onclick="event.stopPropagation()">
        <select class="status-select" style="background:${c.bg};border:1px solid ${c.border};color:${c.text}"
          onchange="updateVideo(${v.id},{status:this.value});renderStats();renderTable()">
          ${opts}
        </select>
      </td>
      <td onclick="event.stopPropagation()" style="text-align:center">
        <input type="checkbox" ${v.scriptWritten?'checked':''} onchange="updateVideo(${v.id},{scriptWritten:this.checked});renderStats()" />
      </td>
      <td onclick="event.stopPropagation()">
        <input type="date" value="${v.publishDate}" onchange="updateVideo(${v.id},{publishDate:this.value});renderCalendar()" />
      </td>
      <td class="td-notes">${v.notes || '<span style="color:#2a0000">click to add…</span>'}</td>
    </tr>`;
  }).join('');
}

// ─── CALENDAR ────────────────────────────────────────────────
function renderCalendar() {
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cal-month-label').textContent = `${months[calMonth]} ${calYear}`;

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();

  const byDate = {};
  videos.forEach(v => {
    if (v.publishDate) { (byDate[v.publishDate] = byDate[v.publishDate] || []).push(v); }
  });

  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d =>
    `<div class="cal-dow">${d}</div>`).join('');

  let cells = Array(firstDay).fill('<div></div>');
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayVs = byDate[dateStr] || [];
    const isToday = today.getDate()===d && today.getMonth()===calMonth && today.getFullYear()===calYear;
    const events = dayVs.slice(0,3).map(v => {
      const c = STATUS_COLORS[v.status];
      return `<div class="cal-event" style="background:${c.bg};border:1px solid ${c.border};color:${c.text}"
        onclick="openModal(${v.id})">${TYPES[v.type].icon} ${v.title}</div>`;
    }).join('');
    const more = dayVs.length > 3 ? `<div class="cal-more">+${dayVs.length-3} more</div>` : '';
    cells.push(`<div class="cal-cell${isToday?' today':''}"><div class="cal-day">${d}</div>${events}${more}</div>`);
  }

  document.getElementById('cal-grid').innerHTML = dows + cells.join('');
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

// ─── MODAL ───────────────────────────────────────────────────
function openModal(id) {
  const v = videos.find(x => x.id === id);
  if (!v) return;
  modalId = id;
  const t = TYPES[v.type];
  const c = STATUS_COLORS[v.status];
  document.getElementById('m-num').textContent = `Video #${v.videoNum}`;
  document.getElementById('m-type').textContent = `${t.icon} ${t.label}`;
  document.getElementById('m-title').textContent = v.title;
  const sel = document.getElementById('m-status');
  sel.innerHTML = STATUSES.map(s => `<option value="${s}" ${v.status===s?'selected':''}>${s}</option>`).join('');
  sel.style.background = c.bg; sel.style.border = `1px solid ${c.border}`; sel.style.color = c.text;
  document.getElementById('m-date').value = v.publishDate;
  document.getElementById('m-script').checked = v.scriptWritten;
  document.getElementById('m-script-label').textContent = v.scriptWritten ? '✍️ Script written!' : 'Script not written yet';
  document.getElementById('m-script-label').style.color = v.scriptWritten ? '#4ade80' : '#5a2a2a';
  document.getElementById('m-notes').value = v.notes;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.add('hidden');
    modalId = null;
  }
}

function modalUpdate(field, value) {
  if (!modalId) return;
  const changes = {};
  changes[field] = value;
  if (field === 'status') {
    const c = STATUS_COLORS[value];
    const sel = document.getElementById('m-status');
    sel.style.background = c.bg; sel.style.border = `1px solid ${c.border}`; sel.style.color = c.text;
  }
}

function toggleModalScript() {
  const cb = document.getElementById('m-script');
  cb.checked = !cb.checked;
  document.getElementById('m-script-label').textContent = cb.checked ? '✍️ Script written!' : 'Script not written yet';
  document.getElementById('m-script-label').style.color = cb.checked ? '#4ade80' : '#5a2a2a';
}

function saveModal() {
  if (!modalId) return;
  updateVideo(modalId, {
    status: document.getElementById('m-status').value,
    publishDate: document.getElementById('m-date').value,
    scriptWritten: document.getElementById('m-script').checked,
    notes: document.getElementById('m-notes').value,
  });
  renderStats();
  render();
  document.getElementById('modal-overlay').classList.add('hidden');
  modalId = null;
}

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  if (activeTab === 'board') renderBoard();
  else if (activeTab === 'table') renderTable();
  else renderCalendar();
}

renderStats();
render();
</script>
</body>
</html>
