<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Horror Content Grimoire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
        :root { --bg: #080000; --surface: #100000; --red: #cc0000; --text: #ffffff; --text-muted: #8a5555; }
        body { background: var(--bg); color: var(--text); font-family: 'Crimson Text', serif; margin: 0; }
        
        #app { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .board { display: flex; gap: 20px; overflow-x: auto; padding-top: 20px; }
        .col { flex: 1; min-width: 250px; background: #0c0000; border: 1px solid #2a0000; border-radius: 8px; padding: 15px; }
        .card { background: #150000; border-left: 3px solid var(--red); padding: 12px; margin-bottom: 10px; cursor: grab; border-radius: 4px; transition: 0.2s; }
        .card:hover { border-left-width: 6px; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #0d0a1a; padding: 30px; border: 1px solid #2a0000; border-radius: 12px; width: 450px; }
        
        .btn { padding: 10px 20px; cursor: pointer; background: var(--red); color: white; border: none; border-radius: 4px; font-family: 'Cinzel'; }
        .guardian-alert { border: 2px solid var(--red); padding: 20px; text-align: center; background: #1a0000; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app">
    <header style="text-align: center;">
        <h1>☽ Content Grimoire ☾</h1>
        <button class="btn" onclick="openModal()">+ Add New Idea</button>
        <button class="btn" onclick="exportData()">Export</button>
    </header>

    <div id="board" class="board"></div>
</div>

<!-- Guardian Modal -->
<div id="guardian-modal" class="modal-overlay hidden">
    <div class="modal guardian-alert">
        <h2 style="color:var(--red)">Grimoire Guardian</h2>
        <p id="guardian-text"></p>
        <button class="btn" onclick="closeGuardian()">Acknowledged</button>
    </div>
</div>

<script>
    let videos = JSON.parse(localStorage.getItem('grimoire-data')) || [];
    const STATUSES = ['Idea', 'Scripting', 'Filming', 'Editing', 'Live'];

    function render() {
        const board = document.getElementById('board');
        board.innerHTML = STATUSES.map(s => `
            <div class="col" ondrop="drop(event)" ondragover="allowDrop(event)" data-status="${s}">
                <h3 style="text-align:center">${s}</h3>
                ${videos.filter(v => v.status === s).map(v => `
                    <div class="card" draggable="true" ondragstart="drag(event)" id="${v.id}" onclick="openModal(${v.id})">
                        <strong>${v.title}</strong><br><small>${v.type}</small>
                    </div>
                `).join('')}
            </div>
        `).join('');
    }

    function drag(e) { e.dataTransfer.setData("text", e.target.id); }
    function allowDrop(e) { e.preventDefault(); }
    function drop(e) {
        e.preventDefault();
        const id = e.dataTransfer.getData("text");
        const status = e.target.closest('.col').dataset.status;
        videos = videos.map(v => v.id == id ? {...v, status} : v);
        localStorage.setItem('grimoire-data', JSON.stringify(videos));
        render();
    }

    function checkGuardian() {
        const today = new Date().toISOString().split('T')[0];
        const overdue = videos.filter(v => v.status !== 'Live' && v.publishDate && v.publishDate <= today);
        if (overdue.length > 0) {
            document.getElementById('guardian-text').innerText = `You are behind on ${overdue.length} video(s). Please review your tasks.`;
            document.getElementById('guardian-modal').classList.remove('hidden');
        }
    }

    function openModal(id = null) {
        // Logic for Add/Edit would go here, simplified for structure
        const title = prompt("Title:");
        if(title) {
            videos.push({ id: Date.now(), title, type: 'Unfold', status: 'Idea', publishDate: '' });
            localStorage.setItem('grimoire-data', JSON.stringify(videos));
            render();
        }
    }

    function closeGuardian() { document.getElementById('guardian-modal').classList.add('hidden'); }
    function exportData() {
        const blob = new Blob([JSON.stringify(videos)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'grimoire.json'; a.click();
    }

    render();
    setTimeout(checkGuardian, 500);
</script>
</body>
</html>
